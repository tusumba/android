name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  android:
    name: CI required
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run JUnit unit tests
        run: bash ./gradlew --no-daemon assembleDebug testDebugUnitTest
